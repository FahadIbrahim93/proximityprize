name: Incidence research kernel check
on:
  push:
    branches: [research/incidence-triples]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1.6.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch dependency cache
        run: ./scripts/lake-locked.sh exe cache get
      - name: Build existing coverage dependency
        run: ./scripts/lake-locked.sh build ArkLib.Data.CodingTheory.ProximityGap.CoveragePigeonhole
      - name: Check research proof
        run: |
          set -o pipefail
          lake env lean scratch/IncidenceTripleMass.lean | tee scratch/axioms.log
          lake env lean scratch/IncidenceAffineLines.lean | tee -a scratch/axioms.log
      - name: Audit research axioms
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scratch/axioms.log').read_text()
          assert 'depends on axioms:' in s
          assert 'sorryAx' not in s
          import re
          matches=re.findall(r'depends on axioms:\s*\[([^\]]*)\]',s)
          assert len(matches)==9
          for names in matches:
              assert set(x.strip() for x in names.split(','))<= {'propext','Classical.choice','Quot.sound'}
          print('Research cube lemma axiom audit clean')
          PY
